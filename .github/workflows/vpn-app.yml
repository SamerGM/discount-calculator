name: Build VPN Proxy APK
on:
  push:
    paths:
      - 'vpn-app/**'
      - '.github/workflows/vpn-app.yml'
  workflow_dispatch:

concurrency:
  group: vpn-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vpn-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs the
      # required platform/build-tools/NDK on demand.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # postinstall fetches the pinned hev-socks5-tunnel sources (SOCKS5 mode)
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode release keystore (optional)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret: release APK will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: vpn-app/android
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/app/release.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Verify native libraries are packaged
        working-directory: vpn-app/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E "libhev-socks5-tunnel.so|libwg-go.so"

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-proxy-release-apk
          path: vpn-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vpntunnel'
version = '0.1.0'

def hevDir = file('third-party/hev-socks5-tunnel')
if (!new File(hevDir, 'Android.mk').exists()) {
  throw new GradleException("hev-socks5-tunnel source missing at ${hevDir}. Run `npm install` (or `bash scripts/fetch-hev.sh`) in vpn-app/.")
}

android {
  namespace 'expo.modules.vpntunnel'
  ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'proguard-rules.pro'
    externalNativeBuild {
      ndkBuild {
        // Only the JNI shared library; skip the standalone CLI binary.
        targets 'hev-socks5-tunnel'
        arguments 'APP_CFLAGS+=-O3', 'APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true'
      }
    }
  }

  externalNativeBuild {
    ndkBuild {
      path 'third-party/hev-socks5-tunnel/Android.mk'
    }
  }
}

dependencies {
  implementation 'com.wireguard.android:tunnel:1.0.20260102'
}
